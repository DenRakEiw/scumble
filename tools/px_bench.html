<!doctype html>
<meta charset="utf-8">
<title>px benchmark</title>
<!--
  The phase B benchmark in a browser (docs/PLAN_BCE.md §B3), for Firefox. Serve the repo
  (or a copy of tools/ and renderer/editor/) over http, e.g. `python -m http.server` from its
  root, and open /tools/px_bench.html. `?auto` starts at once, `?sizes=96&only=mip,edt` limits
  the rows. Served cross-origin isolated (COOP / COEP) the timers resolve 20 µs instead of
  1 ms; the benchmark repeats short kernels either way. If the server takes POSTs, progress
  goes to /log and the result to /result.
-->
<style>
    body { font: 13px/1.45 system-ui, sans-serif; margin: 20px; color: #222; background: #fafafa; }
    table { border-collapse: collapse; margin-top: 12px; }
    td, th { border: 1px solid #ccc; padding: 3px 8px; text-align: right; }
    td:nth-child(-n+2), th:nth-child(-n+2) { text-align: left; }
    pre { background: #fff; border: 1px solid #ddd; padding: 8px; max-height: 40vh; overflow: auto; }
</style>
<h1>px benchmark</h1>
<p id="env"></p>
<button id="run">Run</button>
<pre id="log"></pre>
<table id="table"></table>
<script type="module">
    import { loadPx } from "../renderer/editor/px/px.js";
    import * as js from "../renderer/editor/px/kernels_js.js";
    import { runBench, fmtMs } from "../renderer/editor/px/bench.js";
    import * as raster from "../renderer/editor/inpaint_raster.js";

    const q = new URLSearchParams(location.search);
    const logEl = document.getElementById("log");
    const env = { runtime: navigator.userAgent, isolated: self.crossOriginIsolated === true, cores: navigator.hardwareConcurrency };
    document.getElementById("env").textContent = `${env.runtime} · crossOriginIsolated ${env.isolated}`;

    const post = (url, body) => fetch(url, { method: "POST", body: typeof body === "string" ? body : JSON.stringify(body) }).catch(() => {});
    const log = (line) => { logEl.textContent += line + "\n"; post("/log", line); };

    async function run() {
        document.getElementById("run").disabled = true;
        try {
            const simd = await loadPx("../renderer/editor/px/px.wasm");
            const scalar = await loadPx("../renderer/editor/px/px_scalar.wasm");
            log(`SIMD build loaded: ${simd.simd}, scalar build: ${!scalar.simd}`);
            const result = await runBench({
                impls: { js, scalar, simd },
                extras: { distanceTransform: raster.distanceTransform, floodMask: raster.floodMask },
                sizes: (q.get("sizes") || "96,150").split(","),
                only: q.get("only") ? q.get("only").split(",") : null,
                runs: Number(q.get("runs") || 5),
                warmups: Number(q.get("warmups") || 2),
                log,
            });
            const t = document.getElementById("table");
            t.innerHTML = "<tr><th>kernel</th><th>input</th><th>JS</th><th>scalar</th><th>SIMD</th><th>copy</th><th>speed-up</th></tr>" +
                result.rows.filter((r) => r.js != null).map((r) => `<tr><td>${r.kernel}</td><td>${r.input}</td><td>${fmtMs(r.js)}</td><td>${fmtMs(r.scalar)}</td><td>${fmtMs(r.simd)}</td><td>${fmtMs(r.copy)}</td><td>${r.speedup.toFixed(2)}×</td></tr>`).join("");
            await post("/result", { env, ...result });
            log("done");
        } catch (e) {
            log(`error: ${e && e.stack || e}`);
            await post("/result", { env, error: String(e && e.stack || e) });
        }
    }
    document.getElementById("run").onclick = run;
    if (q.has("auto")) run();
</script>
