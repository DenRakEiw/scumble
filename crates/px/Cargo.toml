[package]
name = "px"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Pixel kernels for Scumble's tile engine (phase B spike, docs/PLAN_BCE.md)"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
miniz_oxide = "0.8"      # MIT, pure Rust deflate for the PNG kernel

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true             # no name section: smaller, and no local paths in the binary
