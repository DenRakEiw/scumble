[package]
name = "px"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Pixel kernels for Scumble's tile engine (phase B spike, docs/PLAN_BCE.md)"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# MIT / Apache-2.0 / Zlib, pure Rust. Deflate with a sync flush per part, so the parts of a PNG are compressed in
# parallel by the worker pool and joined into one zlib stream (docs/PLAN_BCE.md §E2 as built).
miniz_oxide = "0.8"
adler2 = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true             # no name section: smaller, and no local paths in the binary
