# Builds the Windows installer. On a version tag (v0.1.0) it uploads the installer, its
# blockmap and latest.yml to a draft GitHub release (electron-builder --publish); on other
# pushes and pull requests the installer is kept as a workflow artifact only.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # tools/release_notes.py turns CHANGELOG.md into the release body
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: npm ci

      - name: Check the version tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "refs/tags/v$v" = "$GITHUB_REF" ] || { echo "tag $GITHUB_REF but package.json says $v"; exit 1; }

      # electron-builder runs one publisher per file and races itself into two draft releases
      # when none exists yet; creating the draft first makes both find it
      - name: Create the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag=${GITHUB_REF#refs/tags/}
          # the release body is that version's section of CHANGELOG.md; a missing section
          # stops the release rather than shipping someone else's notes
          python tools/release_notes.py "$tag" > release_notes.md
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "Scumble ${tag#v}" --notes-file release_notes.md

      - name: Build installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then npx electron-builder --win nsis --publish always
          else npx electron-builder --win nsis --publish never; fi

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: Scumble-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
