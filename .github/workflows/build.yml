# Builds the Windows installer and portable zip and the Linux AppImage and .deb. On a version tag
# (v0.1.0) the `draft` job creates the draft GitHub release from CHANGELOG.md and both builds upload
# to it (electron-builder --publish: the installer, its blockmap and latest.yml; the AppImage, the
# .deb and latest-linux.yml; gh release upload: Scumble-<version>-portable-win-x64.zip); on other
# pushes and pull requests the files are kept as workflow artifacts only (the zip on every run).
# After both builds, the `sizes` job writes the draft's body again with each file's size in its "Get Scumble" table.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # electron-builder runs one publisher per file and races itself (and the other platform's job)
  # into several draft releases when none exists yet; creating the draft first makes all find it
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the version tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "refs/tags/v$v" = "$GITHUB_REF" ] || { echo "tag $GITHUB_REF but package.json says $v"; exit 1; }

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag=${GITHUB_REF#refs/tags/}
          # the release body is the "Get Scumble" table and that version's section of CHANGELOG.md
          # (tools/release_notes.py; the sizes job adds the files' sizes once both builds uploaded them);
          # a missing section stops the release rather than shipping someone else's notes
          python tools/release_notes.py "$tag" > release_notes.md
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "Scumble ${tag#v}" --notes-file release_notes.md

  windows:
    needs: draft
    # runs when the draft job succeeded or was skipped (not a tag), never after it failed
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # tools/build_px.py below is a Python script
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: npm ci

      # a name that does not exist, a write to an imported binding or to a const: things that
      # parse fine and throw at run time (eslint.config.mjs says what is checked and why)
      - name: Lint
        shell: bash
        run: npx eslint .

      # the three contracts (the editor host, the command descriptors, the recipe shape) against
      # their typedefs; nothing is compiled, tsconfig.check.json says what is checked and why
      - name: Types
        shell: bash
        run: npx tsc --noEmit -p tsconfig.check.json

      # the committed renderer/editor/px/*.wasm must be what crates/px builds; rustup installs the compiler
      # crates/px/rust-toolchain.toml pins, with its wasm target, on the first cargo call
      - name: Check the Rust kernels against their source
        shell: bash
        run: python tools/build_px.py --check

      - name: Build installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then npx electron-builder --win nsis --publish always
          else npx electron-builder --win nsis --publish never; fi

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: Scumble-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      # the portable copy (CLAUDE.md item 36): dist/win-unpacked under one top folder Scumble\ with the marker
      # portable.txt; tools/portable_zip.js refuses a layout without resources\app-update.yml or of another version
      - name: Build the portable zip
        shell: bash
        run: node tools/portable_zip.js

      # on every run, a tag's too: a failed upload to the draft can be redone by hand from the same build
      - uses: actions/upload-artifact@v4
        with:
          name: Scumble-windows-portable
          path: dist/*-portable-win-x64.zip
          compression-level: 0
          if-no-files-found: error

      # the draft exists (the draft job made it); electron-builder uploaded the installer to it above
      - name: Add the portable zip to the draft
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" "dist/Scumble-${GITHUB_REF_NAME#v}-portable-win-x64.zip" --clobber

  linux:
    needs: draft
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # onnxruntime-node would fetch its CUDA provider (hundreds of MB) from NuGet on linux/x64;
      # the Linux build runs the helpers on the CPU (docs/HELPERS.md), so it is not fetched.
      # The Rust kernels are checked once, in the Windows job.
      - name: Install
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci

      - name: Build AppImage and deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then npx electron-builder --linux --publish always
          else npx electron-builder --linux --publish never; fi

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: Scumble-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error

  # the draft's body once more, now with each file's size in its "Get Scumble" table (tools/release_notes.py
  # --assets reads them from the release); only after both builds uploaded their files, only for a draft, and only
  # while the body is still the one the draft job wrote (one edited by hand, or given sizes by an earlier run, is left
  # alone; docs/RELEASING.md says how to redo it). It never fails the release: every failure ends the step with a
  # warning, and the job may fail on its own (continue-on-error).
  sizes:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add the file sizes to the draft's body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag=${GITHUB_REF#refs/tags/}
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft) || { echo "::warning::$tag could not be read; no sizes added"; exit 0; }
          [ "$draft" = "true" ] || { echo "::notice::$tag is no draft (published already); its body is left as it is"; exit 0; }
          python tools/release_notes.py "$tag" > plain_notes.md || { echo "::warning::release_notes.py failed; no sizes added"; exit 0; }
          python tools/release_notes.py "$tag" --assets > release_notes.md || { echo "::warning::release_notes.py --assets failed; no sizes added"; exit 0; }
          gh release view "$tag" --json body > current_body.json || { echo "::warning::the draft's body could not be read; no sizes added"; exit 0; }
          python -c "import json, sys; b = json.load(open('current_body.json', encoding='utf-8'))['body'] or ''; p = open('plain_notes.md', encoding='utf-8').read(); sys.exit(0 if b.strip() == p.strip() else 1)" \
            || { echo "::notice::the draft's body is not the one the draft job wrote (edited by hand, or sized by an earlier run); left as it is"; exit 0; }
          gh release edit "$tag" --notes-file release_notes.md || { echo "::warning::gh release edit failed; the draft keeps its body without sizes"; exit 0; }
          echo "the draft's body now lists the files' sizes"
